syntax = "proto3";

package tutor.v1;

option go_package = "anki/internal/ai/pb;tutorpb";

import "google/protobuf/empty.proto";

// Credentials for service-to-service auth against repetitor user store.
message Credentials {
  string email = 1;
  string password = 2;
}

// Resolved session: user + project + chat ids.
//
// anki_user_id identifies the specific Anki Lite account this call is on
// behalf of. Every Anki Lite user shares one repetitor service account
// (Credentials), so without this field llm-service has no way to tell them
// apart — it would (and, before this field existed, did) collapse every
// Anki user's chat history, BKT mastery, and learning events into one
// shared project. llm-service uses this to look up (or create) a distinct
// project per Anki user; 0 means "not supplied" (old caller), which falls
// back to the single shared project for backward compatibility.
message Session {
  Credentials credentials = 1;
  string project_id = 2;
  string chat_id = 3;
  string practice_chat_id = 4;
  int64 anki_user_id = 5;
}

message EnsureSessionRequest {
  Credentials credentials = 1;
  string project_id = 2;
  string chat_id = 3;
  string practice_chat_id = 4;
}

message StatusResponse {
  bool ready = 1;
  string address = 2;
  string project_id = 3;
  string chat_id = 4;
  string practice_chat_id = 5;
  string error = 6;
}

message ChatRequest {
  Session session = 1;
  string message = 2;
  bool use_practice_chat = 3;
}

message ChatEvent {
  string type = 1;   // content | status | error | done
  string content = 2;
  string status = 3;
  string error = 4;
}

message PracticeRequest {
  Session session = 1;
  repeated string words = 2;
  string level = 3;
}

message PracticeQuestion {
  string prompt = 1;
  repeated string options = 2;
  int32 correct_index = 3;
  string explanation = 4;
}

message PracticeResponse {
  repeated PracticeQuestion questions = 1;
  string source = 2;
  repeated string rag_sources = 3;
}

enum RagCorpus {
  RAG_CORPUS_UNSPECIFIED = 0;
  RAG_CORPUS_EXERCISE = 1;
  RAG_CORPUS_EXAMPLE = 2;
  RAG_CORPUS_EXPLANATION = 3;
}

message RagSearchRequest {
  Session session = 1;
  string query = 2;
  RagCorpus corpus = 3;
  int32 limit = 4;
}

message RagChunk {
  string id = 1;
  string title = 2;
  string snippet = 3;
  float score = 4;
}

message RagSearchResponse {
  repeated RagChunk chunks = 1;
  string context = 2;
}

message EnrichWordRequest {
  Session session = 1;
  string word = 2;
  string level = 3;
}

message EnrichWordResponse {
  string translation = 1;
  string example = 2;
  string transcription = 3;
  string source = 4;   // rag | llm
}

message PublishEventRequest {
  Session session = 1;
  string word = 2;
  bool correct = 3;
  int32 response_time_ms = 4;
  int32 attempts = 5;
  string card_type = 6;
  string difficulty = 7;
}

message PublishEventResponse {
  bool accepted = 1;
}

message ExplainErrorRequest {
  Session session = 1;
  string word = 2;
  string expected = 3;
  string got = 4;
  string sentence = 5;
}

message ExplainErrorResponse {
  string explanation = 1;
  string source = 2;   // rag | llm
}

message GetWeakTopicsRequest {
  Session session = 1;
  int32 limit = 2;
}

message WeakTopic {
  string word = 1;
  double p_know = 2;
  double als = 3;
}

message GetWeakTopicsResponse {
  repeated WeakTopic topics = 1;
}

// TutorService is implemented by adaptive-learning-repetitor.
// Anki is the gRPC client.
service TutorService {
  rpc Health(google.protobuf.Empty) returns (StatusResponse);
  rpc EnsureSession(EnsureSessionRequest) returns (StatusResponse);
  rpc Chat(ChatRequest) returns (stream ChatEvent);
  rpc GeneratePractice(PracticeRequest) returns (PracticeResponse);
  rpc SearchRag(RagSearchRequest) returns (RagSearchResponse);
  rpc EnrichWord(EnrichWordRequest) returns (EnrichWordResponse);
  rpc PublishEvent(PublishEventRequest) returns (PublishEventResponse);
  rpc ExplainError(ExplainErrorRequest) returns (ExplainErrorResponse);
  rpc GetWeakTopics(GetWeakTopicsRequest) returns (GetWeakTopicsResponse);
}

// ===========================================================================
// Reverse channel (Epic 2): llm-service is the CLIENT here, ankis (back/) is
// the SERVER. Lets the chat agent read/write a specific Anki user's own
// vocabulary deck on their behalf, mid-conversation. Deliberately plain unary
// RPCs (topology "A" from IMPROVEMENTS_SPEC.md) rather than a callback woven
// into the existing Chat stream — no correlation/interrupt-resume machinery
// needed, easy to reason about and test in isolation.
// ===========================================================================

message WordDraft {
  string word = 1;
  string translation = 2;
  string example = 3;
  string transcription = 4;
}

message AddWordsRequest {
  int64 user_id = 1;
  repeated WordDraft words = 2;
}

message AddWordResult {
  string word = 1;
  bool added = 2;
  string reason = 3;   // set when added=false, e.g. "already exists", "invalid"
}

message AddWordsResponse {
  repeated AddWordResult results = 1;
}

message DeleteWordRequest {
  int64 user_id = 1;
  string word = 2;
}

message DeleteWordResponse {
  bool deleted = 1;   // false if no such word existed for this user
}

message CheckWordsExistRequest {
  int64 user_id = 1;
  repeated string words = 2;
}

message WordExistCheck {
  string word = 1;
  bool exists = 2;
  string translation = 3;   // populated only when exists=true
}

message CheckWordsExistResponse {
  repeated WordExistCheck results = 1;
}

service LearnWriteService {
  rpc AddWords(AddWordsRequest) returns (AddWordsResponse);
  rpc DeleteWord(DeleteWordRequest) returns (DeleteWordResponse);
  rpc CheckWordsExist(CheckWordsExistRequest) returns (CheckWordsExistResponse);
}
